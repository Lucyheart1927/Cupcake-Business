<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usagi Puffs — Menu Gallery</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

 
    <link rel="stylesheet" href="style.css?v=1" />
  </head>

  <body>
 
    <nav class="navbar navbar-expand-lg navbar-light navbar-cupcake sticky-top" data-bs-theme="light">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Usagi Puffs</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
          aria-controls="nav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div id="nav" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="menu.html">Menu</a></li>
            <li class="nav-item"><a class="nav-link" href="custom.html">Custom Orders</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          </ul>

          <form class="d-flex ms-lg-3 mt-3 mt-lg-0" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search treats..."
              aria-label="Search"
            />
            <button class="btn btn-cupcake" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>

   
    <section class="py-5 text-center">
      <div class="container">
        <h1 class="mb-4 fw-bold">Our Menu</h1>
        <p class="lead mb-5" style="max-width: 700px; margin: 0 auto;">
          Explore our collection of pastel-perfect cream puffs, cupcakes, and sweet creations — each baked with love and a touch of whimsy.
        </p>

        <div class="row g-4">
          
          <div class="col-6 col-md-4 col-lg-3">
            <img src="images/cupcake1.png" class="img-fluid rounded-4 shadow-sm" alt="Strawberry Cream Puff" />
          </div>
          <div class="col-6 col-md-4 col-lg-3">
            <img src="images/cupcake2.png" class="img-fluid rounded-4 shadow-sm" alt="Vanilla Dream Puff" />
          </div>
          <div class="col-6 col-md-4 col-lg-3">
            <img src="images/cupcake3.png" class="img-fluid rounded-4 shadow-sm" alt="Lavender Honey Puff" />
          </div>
          <div class="col-6 col-md-4 col-lg-3">
            <img src="images/cupcake4.png" class="img-fluid rounded-4 shadow-sm" alt="Chocolate Bunny Puff" />
          </div>
          <div class="col-6 col-md-4 col-lg-3">
            <img src="images/cupcake5.png" class="img-fluid rounded-4 shadow-sm" alt="Matcha Cream Puff" />
          </div>
          <div class="col-6 col-md-4 col-lg-3">
            <img src="images/cupcake6.png" class="img-fluid rounded-4 shadow-sm" alt="Caramel Cream Puff" />
          </div>
          <div class="col-6 col-md-4 col-lg-3">
            <img src="images/cupcake7.png" class="img-fluid rounded-4 shadow-sm" alt="Pink Bunny Puff" />
          </div>
          <div class="col-6 col-md-4 col-lg-3">
            <img src="images/cupcake8.png" class="img-fluid rounded-4 shadow-sm" alt="Blueberry Puff" />
          </div>
        </div>
      </div>
    </section>

  
    <footer class="py-4 text-center small text-muted">
      <div class="container">
        © <span id="year"></span> Usagi Puffs • Baked with love and pastel dreams.
      </div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
